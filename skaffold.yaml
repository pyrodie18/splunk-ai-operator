portForward:
  - resourceType: deployment
    resourceName: controller-manager
    port: 9443
    localPort: 9443
    namespace: system
  - resourceType: deployment
    resourceName: cm
    port: 8089
    localPort: 8089
    namespace: ingestion
  - resourceType: deployment
    resourceName: standalone
    port: 8089
    localPort: 8089
    namespace: ingestion