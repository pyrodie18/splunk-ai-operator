# NOTE: Only edit skaffold.yaml.tmpl (the rest is generated)
---
apiVersion: skaffold/v3
kind: SkaffoldConfig
build:
  local:
    push: false
    useBuildkit: true
  tagPolicy:
    gitCommit: {}
  platforms: ["linux/amd64"]
  artifacts:
    - image: splunk-ai-operator
      platforms:
        - linux/amd64
      context: .
      docker:
        dockerfile: Dockerfile
      hooks:
        after: 
        - command: [ "sh", "-c", "./prehook.sh"]
          dir: tools
          os: [ darwin, linux]
        before: 
        - command: [ "sh", "-c", "./cleanup.sh"]
          dir: tools
          os: [ darwin, linux]

deploy:
  kubectl:
    #defaultNamespace: splunk-operator
    flags:
      apply:
        - --server-side

manifests:
  kustomize:
    paths:
      - config/default

#test:
