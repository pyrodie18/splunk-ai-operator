name: "CodeQL Advanced"

# NOTE: This workflow requires GitHub's default CodeQL setup to be DISABLED
# Go to: Settings → Code security and analysis → Code scanning → CodeQL analysis
# Change from "Default" to "Advanced" or disable default setup
# Otherwise, you'll get: "CodeQL analyses from advanced configurations cannot be processed"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '30 1 * * 1'  # Run every Monday at 1:30 AM UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      - if: matrix.build-mode == 'manual'
        name: Manual Build
        shell: bash
        run: |
          echo 'Manual build not required for Go with autobuild'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: true
