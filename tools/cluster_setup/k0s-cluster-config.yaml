# k0s Cluster Configuration for Splunk AI Platform
# ==================================================
# This config supports two deployment modes:
#   1. On-prem/Baremetal: Provide existingIPs with SSH access
#   2. AWS EC2: Leave existingIPs empty to auto-create EC2 instances

cluster:
  # Cluster name (used for tagging and identification)
  name: splunk-ai-k0s

  # Use existing Kubernetes cluster instead of creating new k0s cluster
  # Options:
  #   auto    - Auto-detect: use existing cluster if accessible via KUBECONFIG
  #   force   - Force use existing cluster (fail if not found)
  #   never   - Never use existing cluster, always create new k0s cluster
  useExisting: auto

  # AWS region (only needed for EC2 mode)
  region: us-west-2

  # SSH configuration for accessing nodes
  sshUser: ubuntu
  sshKeyPath: ~/.ssh/k0s-key-pair.pem  # Path to SSH private key

# Node configuration
nodes:
  # Number of controller nodes (1 or 3 recommended for HA)
  controllers: 1

  # Number of CPU worker nodes (8 total nodes: 1 controller + 4 CPU + 3 GPU)
  cpuWorkers: 4

  # Number of GPU worker nodes
  gpuWorkers: 3

  # ==================================================================
  # OPTION 1: On-Prem/Baremetal - Provide existing IP addresses
  # ==================================================================
  # Requirements:
  #   - Passwordless SSH access with sudo privileges
  #   - Ubuntu 22.04 or similar Linux distribution
  #   - Ports 6443, 2380, 10250, 30000-32767 open between nodes
  # ==================================================================
  existingIPs:
    controllers: []
      # Example:
      # - 192.168.1.10
    workers: []
      # Example:
      # - 192.168.1.20
      # - 192.168.1.21
      # - 192.168.1.22

# ==================================================================
# EC2 Configuration (only used if existingIPs are empty)
# ==================================================================
ec2:
  # VPC ID where instances will be created
  vpcId: vpc-0xxxxxxxxxxxx

  # Subnet ID (optional - will use first available if not provided)
  subnetId: ""

  # SSH key name that exists in AWS (must match sshKeyPath)
  keyName: k0s-key-pair

# Instance types for EC2 mode
instanceTypes:
  # Controller node - manages cluster state
  # Recommended: t3.xlarge or larger
  controller: t3.xlarge

  # CPU worker - runs Ray head and CPU-intensive workloads
  # Recommended: m5.4xlarge or larger for AI workloads
  cpuWorker: m5.4xlarge

  # GPU worker - runs GPU-accelerated AI workloads
  # Must be GPU-enabled instance (g4dn, g5, p3, p4)
  gpuWorker: g5.2xlarge

# ==================================================================
# MinIO Configuration (replaces S3 for on-prem)
# ==================================================================
minio:
  # MinIO access credentials
  # IMPORTANT: Change these for production deployments!
  accessKey: minioadmin
  secretKey: minioadmin123

  # Default bucket for AI Platform data
  bucket: ai-platform-data

# ==================================================================
# Kubernetes Configuration
# ==================================================================
kubernetes:
  # Namespace where AI Platform will be deployed
  namespace: ai-platform

# ==================================================================
# Splunk Configuration
# ==================================================================
splunk:
  # Standalone instance name
  standaloneName: splunk-standalone

  # HEC endpoint (optional - for external Splunk)
  hecEndpoint: ""

  # HEC token (optional)
  hecToken: ""

  # Splunk index
  index: ai-platform

# ==================================================================
# ECR Configuration (for private Docker images)
# ==================================================================
# If AI Platform uses private images from AWS ECR, configure this section
# The script will automatically:
#   1. Create ECR image pull secrets with credentials
#   2. Add imagePullSecrets to AIPlatform CR
# ==================================================================
ecr:
  # ECR account ID (optional - will auto-detect from AWS credentials)
  # Example: 667741767953
  account: "6xxxxxxxx"

  # If left empty, the script will use the current AWS account ID

# ==================================================================
# Image Pull Secrets Configuration
# ==================================================================
# The script will CREATE Kubernetes secrets from this configuration
# and pass them to AIPlatform CR spec.images.imagePullSecrets
# ==================================================================
imagePullSecrets:
  # AWS ECR Configuration
  # If enabled, script will create 'ecr-registry-secret' in ai-platform namespace
  ecr:
    enabled: true                    # Set to true to create ECR secret
    # account: ""                    # Optional: ECR account ID (auto-detects if empty)
    # region: "us-west-2"            # Optional: defaults to cluster region
    # AWS credentials are read from environment (AWS CLI must be configured)

  # Docker Hub Configuration
  # If enabled, script will create 'docker-hub-secret' in ai-platform namespace
  dockerHub:
    enabled: false                   # Set to true to create Docker Hub secret
    username: ""                     # Docker Hub username
    password: ""                     # Docker Hub password or access token
    email: ""                        # Optional: Docker Hub email

  # Google Container Registry (GCR) Configuration
  # If enabled, script will create 'gcr-secret' in ai-platform namespace
  gcr:
    enabled: false                   # Set to true to create GCR secret
    # jsonKeyFile: ""                # Path to GCR service account JSON key file
    # Or provide credentials directly:
    username: "_json_key"            # Always use "_json_key" for GCR
    jsonKey: ""                      # Service account JSON key (as string)

  # Azure Container Registry (ACR) Configuration
  # If enabled, script will create 'acr-secret' in ai-platform namespace
  acr:
    enabled: false                   # Set to true to create ACR secret
    registry: ""                     # ACR registry URL (e.g., myregistry.azurecr.io)
    username: ""                     # ACR username (service principal)
    password: ""                     # ACR password (service principal password)

  # Custom Registry Configuration
  # If enabled, script will create 'custom-registry-secret' in ai-platform namespace
  custom:
    enabled: false                   # Set to true to create custom registry secret
    name: "custom-registry-secret"   # Name of the secret to create
    server: ""                       # Registry server (e.g., my-registry.com)
    username: ""                     # Registry username
    password: ""                     # Registry password
    email: ""                        # Optional: email

# ==================================================================
# File Paths
# ==================================================================
files:
  # Path to Splunk Operator manifest
  splunkOperator: ./splunk-operator-cluster.yaml

  # Path to AI Platform manifest
  aiPlatform: ./artifacts.yaml

# ==================================================================
# AI Platform Configuration
# ==================================================================
aiplatform:
  # Ray configuration
  ray:
    version: "2.9.0"
    image: "rayproject/ray:2.9.0"

  # Vector database (Weaviate) configuration
  vectordb:
    image: "semitechnologies/weaviate:1.28.0"
    storageSize: "50Gi"

  # Worker resource configuration
  workers:
    cpu:
      minReplicas: 1
      maxReplicas: 5
      resourcesPerWorker:
        cpu: "4"
        memory: "16Gi"

    gpu:
      minReplicas: 0
      maxReplicas: 2
      resourcesPerWorker:
        cpu: "8"
        memory: "32Gi"
        nvidia.com/gpu: "1"

# ==================================================================
# Example Configurations
# ==================================================================

# On-Prem Example:
# ----------------
# nodes:
#   controllers: 1
#   cpuWorkers: 0  # Not used when providing IPs
#   gpuWorkers: 0  # Not used when providing IPs
#   existingIPs:
#     controllers:
#       - 192.168.1.10
#     workers:
#       - 192.168.1.20  # CPU worker
#       - 192.168.1.21  # CPU worker
#       - 192.168.1.22  # GPU worker

# EC2 Example:
# ------------
# nodes:
#   controllers: 1
#   cpuWorkers: 2
#   gpuWorkers: 1
#   existingIPs:
#     controllers: []  # Empty = create EC2 instances
#     workers: []
