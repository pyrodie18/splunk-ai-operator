---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: kubectl create secret generic s3-secret --from-literal=s3_access_key=$AWS_ACCESS_KEY_ID --from-literal=s3_secret_key=$AWS_SECRET_ACCESS_KEY --namespace $NAMESPACE
    background: false
    skipLogOutput: true
  - command: kubectl apply -f s1_configmap.yaml
    namespaced: true
  - command: helm install splunk-stdl splunk/splunk-enterprise -f s1_config.yaml
    namespaced: true
  - command: kubectl set env deployment/splunk-operator-controller-manager SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
    namespaced: true
