---
cert-manager:
  enabled: false
prometheus:
  enabled: false
opentelemetry-operator:
  enabled: false
objectStorage:
  path: "s3://ai-platform-dev-vivekr"
  region: "us-west-2"
  secretRef: "s3-secret"
features:
  - name: saia
    version: "1.1.0"
    serviceAccountName: saia-service-account
  # - name: seca
  #   version: "1.0.0"
  #   serviceAccountName: saia-secure-account
storage:
  vectorDB:
    pvcName: weaviate-pvc             # Optional: if you want to use a pre-created PVC
    size: 50Gi                        # Optional: used if pvcName is not provided
    storageClassName: gp3             # Optional: used for dynamic PVC provisioning
workerGroupSpec:
  imageRegistry: 667741767953.dkr.ecr.us-west-2.amazonaws.com/ml-platform/ray/ray-worker-gpu:build-5
defaultAcceleratorType: "L40S"
instanceType: "g6.24xlarge"
ingress:
  className: nginx
  hosts:
    - host: ai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ai.example.com
      secretName: ai-platform-tls
splunkConfiguration:
  splunkCustomResourceRef:
    kind: "Standalone"
    name: "splunk-standalone-stdln-0"
    apiVersion: "enterprise.splunk.com/v4"
  endpoint: "splunk-stdln-standalone-service"
  secretRef:
    name: "splunk-stdln-standalone-secret-v1"
certificateRef: saia-cert
serviceTemplate:
  spec:
    type: ClusterIP
kuberay-operator:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - "g6.24xlarge"
