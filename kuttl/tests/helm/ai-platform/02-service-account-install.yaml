---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: aws iam create-policy --policy-name "S3Access-${CLUSTER_NAME}-ai-platform" --policy-document "file://policy_document.json" --query 'Policy.Arn'
  - command: eksctl create iamserviceaccount --cluster "${CLUSTER_NAME}" --namespace $NAMESPACE --name "ray-head-sa" --role-name "IRSA-${CLUSTER_NAME}-ray-head-sa" --attach-policy-arn "arn:aws:iam::667741767953:policy/S3Access-${CLUSTER_NAME}-ai-platform" --approve --override-existing-serviceaccounts
    namespaced: true
  - command: eksctl create iamserviceaccount --cluster "${CLUSTER_NAME}" --namespace $NAMESPACE --name "ray-worker-sa" --role-name "IRSA-${CLUSTER_NAME}-ray-worker-sa" --attach-policy-arn "arn:aws:iam::667741767953:policy/S3Access-${CLUSTER_NAME}-ai-platform" --approve --override-existing-serviceaccounts
    namespaced: true
  - command: eksctl create iamserviceaccount --cluster "${CLUSTER_NAME}" --namespace $NAMESPACE --name "saia-service-sa" --role-name "IRSA-${CLUSTER_NAME}-saia-service-sa" --attach-policy-arn "arn:aws:iam::667741767953:policy/S3Access-${CLUSTER_NAME}-ai-platform" --approve --override-existing-serviceaccounts
    namespaced: true
