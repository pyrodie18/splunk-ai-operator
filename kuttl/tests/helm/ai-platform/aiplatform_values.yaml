---
cert-manager:
  enabled: false
prometheus:
  enabled: false
opentelemetry-operator:
  enabled: false
objectStorage:
  path: "s3://ai-platform-dev-vivekr"
  region: "us-west-2"
  # secretRef: "s3-secret"
serviceAccountName: ray-head-sa
defaultAcceleratorType: L40S
features:
  - name: saia
    version: "1.1.0"
    serviceAccountName: saia-service-account
storage:
  vectorDB:
    size: 50Gi                        # Optional: used if pvcName is not provided
    storageClassName: gp2             # Optional: used for dynamic PVC provisioning
workerGroupSpec:
  imageRegistry: 667741767953.dkr.ecr.us-west-2.amazonaws.com/ml-platform/ray/ray-worker-gpu:build-5
  serviceAccountName: ray-worker-sa
instanceType: "g6.24xlarge"
ingress:
  className: nginx
  hosts:
    - host: ai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ai.example.com
      secretName: ai-platform-tls
splunkConfiguration:
  endpoint: "splunk-splunk-standalone-standalone-service"
  secretRef:
    name: "splunk-splunk-standalone-standalone-secret-v1"
certificateRef: platform-issuer
kuberay-operator:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - "g6.24xlarge"
