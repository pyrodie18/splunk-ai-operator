---
# assert for cert issuer to be available
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: my-ca-issuer
status:
  conditions:
    - status: "True"
      type: Ready

---
# assert for certificate to be available
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-issuer
status:
  conditions:
    - status: "True"
      type: Ready

---
# assert for cert issuer to be available
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
status:
  conditions:
    - status: "True"
      type: Ready
