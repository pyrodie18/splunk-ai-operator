---
# assert for splunk ai operator deployment to be ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk-ai-operator-controller-manager
status:
  readyReplicas: 1
  availableReplicas: 1

---
# assert for RayCluster to be in ready state
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  labels:
    app.kubernetes.io/instance: splunk-ai-platform
status:
  state: ready

---
# assert for RayService to be in ready state
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: splunk-ai-platform

---
# assert for ai platform custom resource to be ready
apiVersion: ai.splunk.com/v1
kind: AIPlatform
metadata:
  name: splunk-ai-platform

---
# assert for ai service saia custom resource to be ready
apiVersion: ai.splunk.com/v1
kind: AIService
metadata:
  name: splunk-ai-platform-saia
