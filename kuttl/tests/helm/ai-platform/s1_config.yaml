---
splunk-operator:
  enabled: true
  splunkOperator:
    clusterWideAccess: false
    persistentVolumeClaim:
      storageClassName: gp2
    image:
      repository: splunk/splunk-operator:2.8.1
  image:
    repository: splunk/splunk:9.4.3
  tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: cp

standalone:
  enabled: true
  tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: cp
