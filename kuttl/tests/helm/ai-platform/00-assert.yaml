---
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: splunk-defaults

---
# assert for splunk operator deployment to be ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk-operator-controller-manager
status:
  readyReplicas: 1
  availableReplicas: 1

---
# check for standalone to be in ready state
apiVersion: enterprise.splunk.com/v4
kind: Standalone
metadata:
  name: splunk-standalone
status:
  phase: Ready
