---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: eksctl delete iamserviceaccount --region "us-west-2" --cluster "${CLUSTER_NAME}" --namespace $NAMESPACE --name "ray-head-sa" || true
  - script: eksctl delete iamserviceaccount --region "us-west-2" --cluster "${CLUSTER_NAME}" --namespace $NAMESPACE --name "ray-worker-sa" || true
  - script: eksctl delete iamserviceaccount --region "us-west-2" --cluster "${CLUSTER_NAME}" --namespace $NAMESPACE --name "saia-service-sa" || true
  - script: |
      POLICY_ARN="arn:aws:iam::667741767953:policy/S3Access-${CLUSTER_NAME}-ai-platform"
      echo "Deleting policy $POLICY_ARN"
      for role in $(aws iam list-entities-for-policy --policy-arn "$POLICY_ARN" --query 'PolicyRoles[].RoleName' --output text 2>/dev/null || true); do
        aws iam detach-role-policy --role-name "$role" --policy-arn "$POLICY_ARN" || true
      done
      aws iam delete-policy --policy-arn "$POLICY_ARN"
    shell: bash
