apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: |
      helm install splunk-ai-platform ../../../../helm-chart/splunk-ai-platform --namespace splunk-ai-platform --create-namespace
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resources:
  - group: ai.splunk.com
    version: v1
    kind: AIPlatform
    name: splunk-ai-platform-splunk-ai-platform
    namespace: splunk-ai-platform
    assert:
      status:
        phase: Running
  - group: ai.splunk.com
    version: v1
    kind: AIService
    name: splunk-ai-platform-splunk-ai-platform-saia
    namespace: splunk-ai-platform
  - group: ai.splunk.com
    version: v1
    kind: AIService
    name: splunk-ai-platform-splunk-ai-platform-seca
    namespace: splunk-ai-platform
