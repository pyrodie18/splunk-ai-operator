---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "splunk-ai-operator.fullname" . }}-controller-manager
  namespace: {{ include "splunk-ai-operator.namespace" . }}
  labels:
{{- include "splunk-ai-operator.labels" . | nindent 4 }}
{{- if .Values.labels }}
{{ toYaml .Values.labels | nindent 4 }}
{{- end }}
{{- if .Values.annotations }}
  annotations:
{{ toYaml .Values.annotations | nindent 4 }}
{{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{- include "splunk-ai-operator.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
{{- with .Values.podAnnotations }}
      annotations:
{{- toYaml . | nindent 8 }}
{{- end }}
      labels:
{{- include "splunk-ai-operator.selectorLabels" . | nindent 8 }}
{{- if .Values.podLabels }}
{{ toYaml .Values.podLabels | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "splunk-ai-operator.serviceAccountName" . }}
      securityContext:
{{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository}}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          command:
          - /manager
{{- with .Values.livenessProbe }}
          livenessProbe:
{{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.readinessProbe }}
          readinessProbe:
{{- toYaml . | nindent 12 }}
{{- end }}
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name=
          resources:
{{- toYaml .Values.resources | nindent 12 }}
{{- with .Values.volumeMounts }}
          volumeMounts:
{{- toYaml .| nindent 12 }}
{{- end }}
{{- with .Values.volumes }}
      volumes:
{{- toYaml .| nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
