{{- if .Values.webhook.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "splunk-ai-operator.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splunk-ai-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
