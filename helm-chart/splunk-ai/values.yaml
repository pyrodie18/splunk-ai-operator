# Default values for splunk-ai.
# This is a YAML-formatted file.
# Users can override these (e.g. via --values) to configure both the CR and the Ingress.

# Metadata overrides:
nameOverride: ""
fullnameOverride: ""

# apps volumes and artifacts volumes
appsVolume:
  path: "s3://my-bucket/apps"
  region: "us-west-2"
artifactsVolume:
  path: "s3://my-bucket"
  region: "us-west-2"

# list of enabled AI services (e.g., saia-spl, saia-sec) and version
features:
  saiaSpl:
    # enables the Splunk AI Service for SPL
    enabled: true
    # version of the Splunk AI Service for SPL
    version: ""
  saiaSec:
    # enables the Splunk AI Service for Security
    enabled: false
    # version of the Splunk AI Service for Security
    version: ""

# specifies object storage for AI artifacts (e.g., S3 or GCS bucket)
storage: ""

sidecar:
  otel:
    # enables the OpenTelemetry collector sidecar
    enabled: true
  prometheusOperator:
    # enables the Prometheus Operator sidecar
    enabled: true

# TLS cert secret managed by cert-manager
certificateRef: ""
# internal cluster DNS suffix
clusterDomain: "cluster.local"
# K8s secretRef for HEC token
splunkConfiguration:
  crName: "splunk-standalone"
  crNamespace: default
  secretRef:
    name: "splunk-secret"
    namespace: default
  endpoint: "https://splunk.default.svc.cluster.local:8089"
  token: "splunk-token"  # Optional, if not using secretRef

scheduling:
  ray:
    # controls GPU node placement for Ray workloads
    nodeSelector: {}
    # affinity for GPU/CPU nodes
    affinity: {}
    # required if GPU nodes are tainted
    tolerations: []
  featureAndVectorDB:
    # CPU nodes scheduling for SAIA and Weaviate
    nodeSelector: {}
    # CPU workload tolerations
    tolerations: []

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # specifies whether a service account should be created
  create: true
  # automatically mount a ServiceAccount's API credentials?
  automount: true
  # annotations to add to the service account
  annotations: {}
  # name of the service account to use.
  # if not set and create is true, a name is generated using the fullname template
  name: ""

defaultAcceleratorType: "LS04S"  # e.g. "L40S", "LS04S", "A10G", "A100", "V100"

# settings for the Ray head node
headGroupSpec:
  serviceAccountName: "default"
  imageRegistry: ""
  schedulingSpec:
    nodeSelector: {}
    tolerations: []
    # - key: nvidia.com/gpu
    #   operator: Exists
    #   effect: NoSchedule
    affinity: {}
    # nodeAffinity:
    #   preferredDuringSchedulingIgnoredDuringExecution:
    #     - weight: 1
    #       preference:
    #         matchExpressions:
    #           - key: node.kubernetes.io/instance-type
    #             operator: In
    #             values:
    #               - g6.24xlarge

# settings for the Ray worker nodes
workerGroupSpec:
  serviceAccountName: "default"
  imageRegistry: ""
  gpuConfigs: []        # e.g. [{tier: "gpu", minReplicas: 1, ...}]
  # - tier: g6.24xlarge-0-gpu
  #   minReplicas: 0
  #   maxReplicas: 10
  #   gpusPerPod: 1
  #   resources:
  #     requests:
  #       cpu: "16"
  #       memory: "32Gi"
  #       ephemeral-storage: "10Gi"
  #       nvidia.com/gpu: "1"
  #     limits:
  #       cpu: "16"
  #       memory: "32Gi"
  #       ephemeral-storage: "10Gi"
  #       nvidia.com/gpu: "1"
  schedulingSpec:
    nodeSelector: {}
    tolerations: []
    # - key: nvidia.com/gpu
    #   operator: Exists
    #   effect: NoSchedule
    affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #       - matchExpressions:
    #         - key: node.kubernetes.io/instance-type
    #           operator: In
    #           values:
    #             - g6.24xlarge

weaviate:
  replicas: 1
  resources: {}
  # requests:
  #   cpu: "0.5"
  #   memory: "1Gi"
  # limits:
  #   cpu: "1"
  #   memory: "2Gi"
  serviceAccountName: "default"
  # inline SchedulingSpec:
  nodeSelector: {}
  tolerations: []
  # - key: dedicated
  #   operator: Equal
  #   value: cpu
  #   effect: NoSchedule
  affinity: {}

# service for exposing the AIPlatform API or UI
service:
  # service type, more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # ports, more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# ingress settings (fully optional)
ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
